global:
  resolve_timeout: 5m

route:
  receiver: slack-alerts
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: slack-alerts
    slack_configs:
      - api_url: "{{ webhook_url }}"
        channel: "#alerts"
        send_resolved: true
        title: '{{ if eq .Status "firing" }} FIRING{{ else }} RESOLVED{{ end }}: {{ .CommonLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Severity:* {{ .Labels.severity }}
          *Description:* {{ .Annotations.description }}
          *Started:* {{ .StartsAt | since }}
          {{ end }}
