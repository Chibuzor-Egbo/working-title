---
# tasks file for monitoring
- name: Create monitoring directory
  file:
    path: /opt/monitoring
    state: directory

#NEW
- name: Create grafana data directory
  file:
    path: /opt/monitoring/grafana_data
    state: directory
    owner: 472
    group: 472
    mode: "0755"
#NEW

- name: Debug app_private_ip
  debug:
    var: app_private_ip

- name: Create Prometheus config
  copy:
    dest: /opt/monitoring/prometheus.yml
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      rule_files:
        - /etc/prometheus/alerts.yml

      alerting:
        alertmanagers:
          - static_configs:
            - targets:
              - alertmanager:9093

      scrape_configs:
        - job_name: "flask-app"
          static_configs:
            - targets: ["{{ app_private_ip }}:5000"]
  notify: Restart prometheus

- name: Create Alertmanager config
  copy:
    dest: /opt/monitoring/alertmanager.yml
    content: |
      global:
        resolve_timeout: 5m
      route:
        receiver: slack-alerts
        group_by: ['alertname']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 1h
      receivers:
        - name: slack-alerts
          slack_configs:
            - api_url: '{{ slack_webhook_url }}'
              channel: '#prometheus-alerts'
              send_resolved: true
              title: '{{ "{{" }} if eq .Status "firing" {{ "}}" }} FIRING{{ "{{" }} else {{ "}}" }} RESOLVED{{ "{{" }} end {{ "}}" }}: {{ "{{" }} .CommonLabels.alertname {{ "}}" }}'
              text: |
                {{ "{{" }} range .Alerts {{ "}}" }}
                *Severity:* {{ "{{" }} .Labels.severity {{ "}}" }}
                *Description:* {{ "{{" }} .Annotations.description {{ "}}" }}
                {{ "{{" }} end {{ "}}" }}

- name: Create alerts rules file
  copy:
    dest: /opt/monitoring/alerts.yml
    src: alerts.yml

- name: Create docker-compose file
  copy:
    dest: /opt/monitoring/docker-compose.yml
    content: |
      version: '3.8'

      services:
        prometheus:
          image: prom/prometheus
          container_name: prometheus
          volumes:
            - /opt/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
          ports:
            - "9090:9090"
          restart: always

        alertmanager:
          image: prom/alertmanager
          container_name: alertmanager
          volumes:
            - /opt/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
          ports:
            - "9093:9093"
          restart: always

        grafana:
          image: grafana/grafana
          container_name: grafana
          ports:
            - "3000:3000"
          volumes:
            - /opt/monitoring/grafana_data:/var/lib/grafana
          restart: always
          environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: "{{ grafana_admin_pass }}"

- name: Start monitoring stack
  shell: docker-compose up -d
  args:
    chdir: /opt/monitoring
